name: Verify public source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  import-reviewed-archive:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'stepankovner/mabetek-tenders'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed source once
        shell: bash
        run: |
          set -eu
          test ! -e src/worker.ts || exit 0
          echo 'dc782c368f1f6d7722c9029ceb8a911d8a9eedaa6f4de0d6484d309416a7262c  mabetek-tenders-source.zip' | sha256sum -c -
          unzip -oq mabetek-tenders-source.zip -x '.github/*'
          git add .gitignore README.md agent examples migrations reports src tests wrangler.toml
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'Import reviewed source tree'
          git push origin HEAD:main
  test:
    needs: import-reviewed-archive
    if: always() && !cancelled() && needs.import-reviewed-archive.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r agent/requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.mjs
      - run: npx --yes --package typescript@5.9.3 tsc --noEmit --target ES2022 --module esnext --moduleResolution bundler --allowJs --skipLibCheck src/worker.ts
