name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r agent/requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests
      - run: npm test
      - run: npm run typecheck
      - name: Check the Worker bundle without publishing
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.165.0 deploy --dry-run --outdir "$RUNNER_TEMP/mabetek-worker"
  deploy-pilot:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PILOT == 'true'
    runs-on: ubuntu-latest
    environment: pilot
    concurrency:
      group: mabetek-pilot-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy and verify the pilot revision
        env:
          CLOUDFLARE_ACCOUNT_ID: c9a963f743353c47b62e1aa80fd343e7
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          revision=$(bash tools/publish-worker.sh)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 -A 'Mabetek-Tenders/1.0' 'https://mabetek-zakupki.flight-tracker.workers.dev/health' | jq -e --arg revision "$revision" '.release == $revision'; then
              exit 0
            fi
            sleep 3
          done
          exit 1
