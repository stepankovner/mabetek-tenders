name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r agent/requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.mjs
      - run: npx --yes --package typescript@5.9.3 -c 'node --test tests/integration.cjs'
  deploy-pilot:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PILOT == 'true'
    runs-on: ubuntu-latest
    environment: pilot
    concurrency:
      group: mabetek-pilot-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy and verify the pilot revision
        env:
          CLOUDFLARE_ACCOUNT_ID: c9a963f743353c47b62e1aa80fd343e7
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          revision=$(git rev-parse --short=12 HEAD)
          npx --yes wrangler@4 d1 execute mabetek-tenders --remote --file migrations/0003.sql
          npx --yes wrangler@4 d1 execute mabetek-tenders --remote --file migrations/0004.sql
          npx --yes wrangler@4 d1 execute mabetek-tenders --remote --file migrations/0005.sql
          npx --yes wrangler@4 deploy --var "RELEASE:$revision" --name mabetek-zakupki --keep-vars
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 'https://mabetek-zakupki.flight-tracker.workers.dev/health' | jq -e --arg revision "$revision" '.release == $revision'; then
              exit 0
            fi
            sleep 3
          done
          exit 1
